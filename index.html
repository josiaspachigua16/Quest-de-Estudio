<!DOCTYPE html>
<html lang="es">

<title>Quest de Estudio — Arrastrá tu material y jugá</title>
<script>try{var qt=localStorage.getItem("qtheme");if(qt)document.documentElement.dataset.theme=qt}catch(e){}</script>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f0ff;--card:rgba(255,255,255,.82);--ink:#1b1740;--mut:#645f8c;--ac:#5b4bff;--ac2:#b14bff;--ok:#16a765;--bad:#e2445c;--gold:#e8a600;--line:#ddd7f7;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a091d;--card:rgba(24,22,58,.82);--ink:#ecebff;--mut:#a09dcc;--ac:#8b7dff;--ac2:#c27bff;--ok:#2ecc87;--bad:#ff6b83;--gold:#ffd166;--line:#302d66;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0a091d;--card:rgba(24,22,58,.82);--ink:#ecebff;--mut:#a09dcc;--ac:#8b7dff;--ac2:#c27bff;--ok:#2ecc87;--bad:#ff6b83;--gold:#ffd166;--line:#302d66;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box;margin:0}
body{font-family:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;line-height:1.5;overflow-x:hidden}
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden}.bg i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.38;animation:fl 16s ease-in-out infinite alternate}
.bg i:nth-child(1){width:420px;height:420px;background:var(--ac);top:-120px;left:-100px}.bg i:nth-child(2){width:380px;height:380px;background:var(--ac2);bottom:-120px;right:-80px;animation-delay:-6s}.bg i:nth-child(3){width:260px;height:260px;background:#26c6da;top:40%;left:55%;opacity:.2;animation-delay:-3s}
@keyframes fl{to{transform:translate(60px,40px) scale(1.15)}}
main{max-width:840px;margin:0 auto;padding:0 18px 190px}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:26px;box-shadow:0 18px 50px rgba(60,40,160,.14);backdrop-filter:blur(14px);animation:up .4s cubic-bezier(.2,.9,.3,1)}
@keyframes up{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:none}}
h1{font-size:2.1rem;line-height:1.12;margin-bottom:8px}h2{font-size:1.4rem;margin-bottom:6px}p,small,label{color:var(--mut)}
.btn{border:0;border-radius:14px;padding:13px 22px;font:inherit;font-weight:700;color:#fff;background:linear-gradient(120deg,var(--ac),var(--ac2));cursor:pointer;transition:transform .2s,box-shadow .2s;box-shadow:0 8px 20px rgba(91,75,255,.3)}
.btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 12px 26px rgba(91,75,255,.4)}.btn:disabled{opacity:.4;cursor:not-allowed}.btn.g{background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn:focus-visible,.opt:focus-visible,.gh:focus-visible,.lv:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.mt{margin-top:16px}.center{text-align:center}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.chips span{font-size:.8rem;font-weight:700;padding:5px 11px;border-radius:99px;background:rgba(91,75,255,.12);color:var(--ac)}
.dz{border:2px dashed var(--ac);border-radius:22px;padding:46px 20px;text-align:center;background:rgba(91,75,255,.05);transition:.25s;margin-top:18px}.dz.on{background:rgba(91,75,255,.18);transform:scale(1.02)}.dz b{display:block;font-size:1.2rem;color:var(--ink);margin-bottom:6px}.dz .ic{font-size:2.8rem;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
.hd{display:flex;gap:18px;align-items:center}.ring{position:relative;width:92px;height:92px;flex:0 0 92px}.ring svg{transform:rotate(-90deg)}.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:1.15rem}
.bar{height:8px;border-radius:9px;background:var(--line);overflow:hidden;margin:10px 0}.bar i{display:block;height:100%;background:linear-gradient(120deg,var(--ac),var(--ac2));transition:width .5s cubic-bezier(.2,.9,.3,1)}
.lv{display:flex;gap:14px;align-items:center;padding:15px;border:1px solid var(--line);border-radius:18px;margin-top:10px;cursor:pointer;background:var(--card);transition:.2s;animation:up .4s both}
.lv:hover:not(.lock){transform:translateX(5px);border-color:var(--ac)}.lv.lock{opacity:.5;cursor:not-allowed}.lv.cur{border-color:var(--ac);box-shadow:0 0 0 3px rgba(91,75,255,.18)}
.bd{width:46px;height:46px;flex:0 0 46px;border-radius:14px;display:grid;place-items:center;font-weight:800;color:#fff;background:linear-gradient(120deg,var(--ac),var(--ac2))}.lv.lock .bd{background:var(--line);color:var(--mut)}.lv.ok .bd{background:var(--ok)}
.sec{border:1px solid var(--line);border-radius:18px;padding:18px 20px;margin:14px 0;background:var(--bg)}.sec p{color:var(--ink);margin:0 0 10px;line-height:1.75;font-size:1.05rem}.sec p:last-child{margin:0}.sec.ex{border-color:var(--gold);background:rgba(232,166,0,.1)}.lb{display:inline-block;font-weight:800;font-size:.78rem;letter-spacing:.05em;text-transform:uppercase;color:var(--ac);margin-bottom:8px}.ex .lb{color:var(--gold)}.un{display:block;margin-top:16px;font-size:.74rem;font-weight:800;letter-spacing:.05em;color:var(--ac);text-transform:uppercase}.dz{cursor:pointer}
.q{font-size:1.18rem;font-weight:700;margin:14px 0}.dots{display:flex;gap:6px}.dots i{width:11px;height:11px;border-radius:50%;background:var(--line);transition:.3s}.dots i.d{background:var(--ac)}.dots i.k{background:var(--ok)}.dots i.x{background:var(--bad)}
.opt{display:flex;gap:12px;align-items:center;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:15px;padding:13px 15px;margin-top:9px;font:inherit;cursor:pointer;transition:.2s}.opt:hover:not(:disabled){border-color:var(--ac);transform:translateX(4px)}
.opt kbd{flex:0 0 28px;height:28px;border-radius:9px;display:grid;place-items:center;font:700 .8rem inherit;background:rgba(91,75,255,.14);color:var(--ac)}
.opt.c{border-color:var(--ok);background:rgba(22,167,101,.16);animation:pop .4s}.opt.w{border-color:var(--bad);background:rgba(226,68,92,.14);animation:sh .4s}
@keyframes pop{50%{transform:scale(1.03)}}@keyframes sh{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.fb{border-radius:16px;padding:14px;margin-top:14px;border:1px solid var(--line);animation:up .3s}.fb.g{border-color:var(--ok)}.fb.b{border-color:var(--bad)}
.big{font-size:3.2rem;font-weight:800}.stars{font-size:2rem;letter-spacing:6px}.spin{width:40px;height:40px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--ac);animation:sp 1s linear infinite;margin:10px auto}@keyframes sp{to{transform:rotate(360deg)}}
a{color:var(--ac)}.err{color:var(--bad);font-weight:700;margin-top:10px}kbd{font-family:inherit}
.xpf{position:fixed;font-weight:800;color:var(--gold);pointer-events:none;z-index:70;animation:fu 1s ease-out forwards}@keyframes fu{to{transform:translateY(-60px);opacity:0}}
#cf{position:fixed;inset:0;pointer-events:none;z-index:80}
#dog .tail{transform-origin:150px 168px;animation:wag .45s ease-in-out infinite alternate}@keyframes wag{to{transform:rotate(22deg)}}
#dog .eyes{transform-origin:100px 99px;animation:bl 4.5s infinite}@keyframes bl{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
#dog .eg.l{transform-origin:62px 72px;animation:ea 3s ease-in-out infinite alternate}#dog .eg.r{transform-origin:138px 72px;animation:eb 3.4s ease-in-out infinite alternate}@keyframes ea{to{transform:rotate(-5deg)}}@keyframes eb{to{transform:rotate(5deg)}}
#dog .mh,#dog .ms,#dog .mw,#dog .bs,#dog .ts,#dog .tg,#dog .mc{display:none}
#mascot:not(.talk) .mc{display:block}#mascot.talk[data-mood="happy"] .mh,#mascot.talk[data-mood="happy"] .tg,#mascot.talk[data-mood="sad"] .ms,#mascot.talk[data-mood="wow"] .mw{display:block}#mascot[data-mood="sad"] .bs,#mascot[data-mood="sad"] .ts{display:block}
#mascot.talk .mh,#mascot.talk .tg,#mascot.talk .ms,#mascot.talk .mw{transform-box:fill-box;transform-origin:50% 0;animation:mt .3s ease-in-out infinite alternate}@keyframes mt{from{transform:scaleY(.55)}to{transform:scaleY(1)}}
#mascot[data-mood="sad"] .tail{animation-duration:2s}#mascot.jump #dog{animation:jp .7s}@keyframes jp{30%{transform:translateY(-34px) rotate(-6deg)}60%{transform:translateY(0)}80%{transform:translateY(-10px)}}
#dog .cap,#dog .gl{display:none}#mascot[data-lv="2"] .cap,#mascot[data-lv="3"] .cap,#mascot[data-lv="4"] .cap,#mascot[data-lv="5"] .cap,#mascot[data-lv="6"] .cap{display:block}#mascot[data-lv="4"] .gl,#mascot[data-lv="5"] .gl,#mascot[data-lv="6"] .gl{display:block}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* FASE 2: header, mascota, dashboard y tarjeta de tema (mobile-first) */
.i{width:1.1em;height:1.1em;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.2em}.i.f{fill:currentColor}
h1{font-size:1.7rem}.card{padding:18px}main{padding:0 14px 120px}
.top{position:relative;max-width:840px;margin:0 auto;padding:10px 12px;display:flex;align-items:center;gap:8px}
.brand{display:flex;align-items:center;gap:6px;flex:0 0 auto;font-weight:800;font-size:1.05rem;color:var(--ac)}.brand .i{width:24px;height:24px}
.brand>span{background:linear-gradient(120deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap}.b2{display:none}
.stats{display:flex;gap:6px;flex:1;min-width:0;justify-content:flex-end}
.pill{display:inline-flex;align-items:center;gap:4px;white-space:nowrap;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:5px 9px;font-weight:700;font-size:.78rem;backdrop-filter:blur(8px)}
.pill .nm{display:none}#lv .i{color:var(--ac)}#xp .i{color:var(--gold)}#st .i{color:#ff7a1a}
.gh{display:inline-flex;align-items:center;justify-content:center;gap:10px;background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:12px;padding:8px 11px;cursor:pointer;font:inherit;font-weight:600}.gh:hover{border-color:var(--ac)}.gh svg{width:18px;height:18px}.gh .lbl{font-size:.92rem}.hb{flex:0 0 auto}.gh.arm{color:var(--bad)}
.acts{display:none;position:absolute;top:calc(100% + 4px);right:12px;z-index:90;flex-direction:column;gap:4px;min-width:210px;padding:8px;background:var(--bg);border:1px solid var(--line);border-radius:16px;box-shadow:0 18px 40px rgba(20,10,80,.28)}
.acts .gh{width:100%;justify-content:flex-start;border:0;background:transparent}.acts .gh:hover{background:rgba(91,75,255,.1)}.top.open .acts{display:flex}
#mascot{position:fixed;left:0;right:0;bottom:0;z-index:60;display:flex;flex-direction:row-reverse;align-items:flex-end;gap:10px;padding:6px 12px calc(6px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--line);backdrop-filter:blur(14px);cursor:pointer;-webkit-tap-highlight-color:transparent}
#dog{width:58px;flex:0 0 58px;display:block;margin-top:-16px;animation:bob 3s ease-in-out infinite;filter:drop-shadow(0 6px 8px rgba(0,0,0,.25))}
#speech{flex:1;min-width:0;align-self:center;font-size:.8rem;font-weight:600;line-height:1.35;color:var(--ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}#mascot:not(.talk) #speech{color:var(--mut)}
.hd{display:flex;align-items:center;gap:14px}.ring{position:relative;width:76px;height:76px;flex:0 0 76px}.ring svg{width:100%;height:100%;transform:rotate(-90deg)}.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:1rem}
.hd>div:last-child{flex:1;min-width:0}.ttl{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-overflow:ellipsis;overflow-wrap:anywhere;line-height:1.2}.un{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lv{display:flex;align-items:center;gap:12px;padding:12px;margin-top:10px;max-width:100%;overflow:hidden}.lv:hover:not(.lock){transform:none;border-color:var(--ac)}.lv>div:last-child{flex:1;min-width:0}
.lv b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere;line-height:1.25}.lv small{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-top:2px}
.bd{width:40px;height:40px;flex:0 0 40px;border-radius:12px;font-size:.95rem}.bd .i{width:20px;height:20px}.gold{color:var(--gold);display:inline-flex}
@media(hover:hover){.lv:hover:not(.lock){transform:translateX(4px)}}
@media(min-width:520px){.b2{display:inline}.pill{font-size:.82rem;padding:6px 12px}}
@media(min-width:600px){h1{font-size:2.1rem}.card{padding:26px}.ring{width:92px;height:92px;flex-basis:92px}.ring b{font-size:1.15rem}.lv{padding:15px;gap:14px}.bd{width:46px;height:46px;flex-basis:46px}}
@media(min-width:760px){main{padding:0 18px 190px}.top{padding:14px 18px}.pill .nm{display:inline}.hb{display:none}
.acts{display:flex;position:static;flex-direction:row;min-width:0;padding:0;background:none;border:0;box-shadow:none;gap:8px}.acts .gh{width:auto;border:1px solid var(--line);background:var(--card)}.acts .lbl{display:none}.acts .gh.arm .lbl{display:inline}
#mascot{left:auto;right:16px;bottom:calc(12px + env(safe-area-inset-bottom,0px));display:block;width:136px;padding:0;background:none;border:0;backdrop-filter:none}#dog{width:100%;margin:0}
#speech{position:absolute;right:8px;bottom:100%;width:220px;padding:10px 13px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:16px 16px 4px 16px;font-size:.84rem;opacity:0;transform:translateY(8px) scale(.9);transition:.35s cubic-bezier(.2,1.4,.3,1);backdrop-filter:blur(10px);pointer-events:none;display:block;overflow:visible}#mascot.talk #speech{opacity:1;transform:none}}
/* FASE 3: dropzone, badges y vista de lectura (mobile-first) */
.lead{max-width:34em;margin:0 auto;text-align:center}.hero-t{text-align:center;margin-bottom:8px}
.dz{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:190px;padding:28px 16px;margin-top:20px;border:2px dashed var(--ac);border-radius:22px;background:rgba(91,75,255,.05);text-align:center;cursor:pointer;transition:background .2s,border-color .2s,transform .2s,box-shadow .2s}
.dz *{pointer-events:none}.dz .i{width:52px;height:52px;stroke-width:1.6;color:var(--ac);transition:color .2s}
.dz b{display:block;font-size:1.1rem;color:var(--ink);margin:0}.dz small{display:block}.dz .t2{display:none}
.dz:hover,.dz:focus-visible{background:rgba(91,75,255,.11);border-color:var(--ac2)}
.dz.on{border-style:solid;border-color:var(--ok);background:rgba(22,167,101,.15);box-shadow:0 0 0 5px rgba(22,167,101,.22);transform:scale(1.02)}
.dz.on .i{color:var(--ok);animation:bob .8s ease-in-out infinite}.dz.on .t1{display:none}.dz.on .t2{display:block;color:var(--ok)}
#msg{text-align:center}
.feats{display:flex;flex-wrap:wrap;justify-content:center;gap:10px 20px;margin-top:22px}
.feats span{display:inline-flex;align-items:center;gap:7px;font-size:.85rem;font-weight:600;color:var(--mut)}.feats .i{color:var(--ac)}
.cont{display:inline-flex;align-items:center;gap:8px;max-width:100%}.cont span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn.g:disabled{opacity:1;color:var(--mut);background:transparent;border:1.5px dashed var(--mut);cursor:not-allowed;transform:none}
.meta{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:10px 18px;margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
.src{display:inline-flex;align-items:center;gap:7px;font-size:.85rem;font-weight:600;color:var(--mut)}
.vl{display:inline-flex;align-items:center;gap:7px;min-height:44px;padding:9px 14px;border:1px solid var(--line);border-radius:12px;font-weight:700;font-size:.88rem;text-decoration:none;color:var(--ac);background:var(--card)}.vl:hover{border-color:var(--ac)}
@media(min-width:760px){.dz{min-height:220px}.dz b{font-size:1.25rem}.meta{justify-content:space-between}}
/* FASE 4: animaciones, boca sincronizada y botones presionables (game feel) */
:root{--bsh:#3b30c9}@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bsh:#4a3ccf}}:root[data-theme="dark"]{--bsh:#4a3ccf}
@keyframes idle{0%,100%{transform:rotate(-2.5deg) translateY(0)}50%{transform:rotate(2.5deg) translateY(-3px)}}
#dog{transform-origin:50% 100%;animation:idle 4s ease-in-out infinite}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 5px 0 var(--bsh),0 12px 18px rgba(91,75,255,.25);transition:transform .08s,box-shadow .08s,filter .15s}
.btn.g{--bsh:var(--line);box-shadow:0 5px 0 var(--bsh)}
.btn:hover:not(:disabled){transform:none;filter:brightness(1.07);box-shadow:0 5px 0 var(--bsh),0 12px 18px rgba(91,75,255,.3)}
.btn.g:hover:not(:disabled){box-shadow:0 5px 0 var(--bsh)}
.btn:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 var(--bsh),0 3px 6px rgba(91,75,255,.25)}
.btn:disabled{box-shadow:none;transform:none}
.opt{box-shadow:0 4px 0 var(--line)}.opt:hover:not(:disabled){transform:none;border-color:var(--ac)}.opt:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--line)}.opt:disabled{box-shadow:none}
.lb{display:inline-flex;align-items:center;gap:6px}.fh{display:inline-flex;align-items:center;gap:6px}.fb.g .fh{color:var(--ok)}.fb.b .fh{color:var(--bad)}
.stars{display:flex;justify-content:center;gap:6px;margin:6px 0;letter-spacing:0}.stars .i{width:34px;height:34px;color:var(--gold)}.stars .o{color:var(--mut);opacity:.45}
</style>
</head>
<body>
<div class="bg"><i></i><i></i><i></i></div>
<header class="top" id="top">
<div class="brand"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg><span>Quest<span class="b2"> de Estudio</span></span></div>
<div class="stats"><span class="pill" id="lv"></span><span class="pill" id="xp"></span><span class="pill" id="st"></span></div>

<main id="app"></main>

<g class="eg l"><ellipse cx="48" cy="98" rx="19" ry="36" fill="#c9862f" transform="rotate(-22 48 98)"/></g><g class="eg r"><ellipse cx="152" cy="98" rx="19" ry="36" fill="#c9862f" transform="rotate(22 152 98)"/></g>
<ellipse cx="100" cy="172" rx="58" ry="38" fill="#f0b46a"/><ellipse cx="72" cy="200" rx="14" ry="9" fill="#ffe0b3"/><ellipse cx="128" cy="200" rx="14" ry="9" fill="#ffe0b3"/>
<ellipse cx="100" cy="105" rx="58" ry="52" fill="#f5c274"/><ellipse cx="100" cy="76" rx="30" ry="16" fill="#ffe0b3" opacity=".5"/>

<ellipse cx="63" cy="120" rx="10" ry="6" fill="#ff9b9b" opacity=".55"/><ellipse cx="137" cy="120" rx="10" ry="6" fill="#ff9b9b" opacity=".55"/>

async function pdfLines(f){

    for(const it of c.items){

const txtLines=async f=>{const R=(await f.text()).split(/\r?\n/),bl=R.some(x=>!x.trim()),L=[];let pb=true;for(const r of R){const t=r.replace(/\s+/g,' ').trim();if(!t){pb=true;continue}L.push({t,h:0,pb:pb||!bl});pb=false}return L};
const STOP=new Set('porque cuando donde desde hasta entre sobre según también cada otros otras estos estas ellos ellas aquel aquella pueden deben tienen través mismo misma mismos mismas todas todos aunque además durante luego antes después sino cuales quien quienes mientras ningún ninguna ninguno algún alguna alguno todavía forma manera tipos puede debe parte caso casos'.split(' '));
const DEF=/^([A-ZÁÉÍÓÚÑ"“][^,;:.()]{2,70}?)\s+(?:es|son|se define como|se denomina|consiste en|se entiende por|se caracteriza por)\s+(.{30,})$/;
const BAD=/^(Esto|Esta|Este|Ello|Eso|Esa|Ese|Estos|Estas|Aquel|Lo|Que|Cuando|Si|Para|En|Por|Como|Al|Del|Con|Sin|Es|Son)\b/;
const sents=t=>t.split(/(?<=[.!?;])\s+(?=[A-ZÁÉÍÓÚÑ¿¡"“(])/).map(s=>s.trim()).filter(s=>s.length>=40&&s.length<=330);
const WRD=/[A-Za-zÁÉÍÓÚÜÑáéíóúüñ]{6,}/g;

function isHead(l,med){
  const t=l.t;if(t.length<3||t.length>110||/[.;,]$/.test(t))return false;
  if(/^(unidad|cap[ií]tulo|tema|t[ií]tulo|secci[oó]n|m[oó]dulo)\b/i.test(t))return true;
  const lt=t.replace(/[^A-Za-zÁÉÍÓÚÑáéíóúñ]/g,'');
  if(lt.length>=4&&lt===lt.toUpperCase())return true;
  if(l.h&&med&&l.h>med*1.12)return true;
  return /^(\d+(\.\d+)*|[IVXLC]+)[.)]\s+\S/.test(t)&&t.length<70}
const EXR=/^ejemplos?\s*[:.\-–—]\s*/i;
function sections(L){
  const UP=/^(unidad|cap[ií]tulo|m[oó]dulo)\s+([ivxlcdm]+|\d+)\b/i,ix=[];
  L.forEach((l,n)=>{if(UP.test(l.t)&&l.t.length<120)ix.push(n)});
  let st=-1;
  for(let k=0;k<ix.length;k++){const end=k+1<ix.length?ix[k+1]:L.length;if(L.slice(ix[k]+1,end).reduce((a,l)=>a+l.t.length,0)>=200){st=ix[k];break}}
  if(st>0)L=L.slice(st);
  const hs=L.filter(l=>l.h).map(l=>l.h).sort((a,b)=>a-b),med=hs.length?hs[hs.length>>1]:0,out=[];
  let unit='',cur=null,mode='dev',para='';
  const flush=()=>{if(para.trim()&&cur)cur[mode].push(para.trim());para=''};
  const fin=()=>{flush();if(cur&&(cur.dev.length||cur.ex.length))out.push(cur);cur=null};
  const start=t=>{cur={title:t.replace(/[:\s]+$/,''),unit,dev:[],ex:[]};mode='dev'};
  for(const l of L){
    if(/^(unidad|cap[ií]tulo)\b/i.test(l.t)&&l.t.length<120&&!/[.;,]$/.test(l.t)){fin();unit=l.t.replace(/[:\s]+$/,'');continue}
    if(cur&&EXR.test(l.t)){flush();mode='ex';para=l.t.replace(EXR,'');continue}
    if(isHead(l,med)){fin();start(l.t);continue}
    if(!cur)start('');
    if(l.pb&&para)flush();
    para+=(para?' ':'')+l.t}

  return out}
function buildTemas(secs,name){
  secs.forEach(s=>{s.title=s.title||name;s.text=s.dev.join(' ')});
  const tf={};secs.forEach(s=>(s.text.match(WRD)||[]).forEach(w=>{w=w.toLowerCase();if(!STOP.has(w))tf[w]=(tf[w]||0)+1}));
  let pool=Object.keys(tf).filter(w=>tf[w]>=2);if(pool.length<12)pool=Object.keys(tf);
  const defs=[];
  secs.forEach((s,ti)=>{s.ss=sents(s.text);s.ss.forEach(x=>{const m=DEF.exec(x);if(m&&!BAD.test(m[1])&&m[1].split(' ').length<=9)defs.push({ti,term:m[1].trim(),def:m[2].replace(/[.;]$/,'').trim(),src:x})})});
  return secs.map((s,ti)=>{
    const pages=[];let cur=[],len=0;
    for(const p of s.dev){if(cur.length&&len+p.length>900){pages.push({k:'d',paras:cur});cur=[];len=0}cur.push(p);len+=p.length}
    if(cur.length)pages.push({k:'d',paras:cur});
    if(s.ex.length)pages.push({k:'e',paras:s.ex});
    const qs=[];
    defs.filter(d=>d.ti===ti).slice(0,2).forEach((d,k)=>{const q=defQ(d,k%2,defs);if(q)qs.push(q)});
    const good=s.ss.filter(x=>x.length>=60&&x.length<=240),rest=s.ss.filter(x=>x.length<60||x.length>240);
    for(const x of [...shuf(good),...shuf(rest)]){if(qs.length>=5)break;const q=clozeQ(x,pool,tf);if(q)qs.push(q)}
    return{title:s.title,unit:s.unit,pages,qs,best:0,passed:false}}).filter(t=>t.pages.length)}

function defQ(d,rev,defs){
  const others=defs.filter(x=>x.term.toLowerCase()!==d.term.toLowerCase());if(others.length<3)return null;
  const key=rev?'term':'def',f=x=>rev?x.term:cut(x.def,150);
  const ds=shuf(others.slice()).sort((a,b)=>Math.abs(a[key].length-d[key].length)-Math.abs(b[key].length-d[key].length)).slice(0,6);
  const opts=[f(d),...shuf(ds).slice(0,3).map(f)];if(new Set(opts).size<4)return null;
  const subj=d.term.replace(/^(El|La|Los|Las|Un|Una)\b/,m=>m.toLowerCase());
  return{q:rev?'¿A qué concepto corresponde esta descripción? «'+cut(d.def,200)+'»':'¿Cuál de estas opciones describe mejor '+subj+'?',options:opts,correct:0,exp:'Según tu material: «'+d.src+'»',v:'¿Qué es '+subj+'?'}}
function clozeQ(x,pool,tf){
  const ws=(x.match(WRD)||[]).slice(1).filter(w=>!STOP.has(w.toLowerCase()));if(!ws.length)return null;
  const sc=w=>(tf[w.toLowerCase()]||0)+w.length/10,a=ws.sort((p,q)=>sc(q)-sc(p))[0],al=a.toLowerCase();

  const cand=pool.filter(w=>w!==al&&w.slice(0,5)!==stem&&!low.includes(w)).map(w=>({w,s:Math.abs(w.length-al.length)+(w.slice(-1)===al.slice(-1)?0:2)+Math.random()*2})).sort((p,q)=>p.s-q.s).slice(0,3).map(o=>o.w);
  if(cand.length<3)return null;
  const blank=x.replace(new RegExp('(?<![\\p{L}])'+a+'(?![\\p{L}])','giu'),'_____');if(blank===x)return null;
  const up=/^[A-ZÁÉÍÓÚÑ]/.test(a);
  return{q:'Completá la frase de tu material: «'+blank+'»',options:[a,...cand.map(w=>up?cap(w):w)],correct:0,exp:'Según tu material: «'+x+'»',v:cut(x,140)}}

  app.innerHTML=`<div class="card"><h1 class="hero-t">Arrastrá tu material y jugá</h1>
  <p class="lead">Convertimos tu documento en temas con examen. Se avanza en orden, un tema por vez.</p>
  <div id="dz" class="dz" tabindex="0" role="button" aria-label="Soltar o buscar documento">${ic('upload')}<b class="t1">Soltá acá tu documento o tocá para buscarlo</b><b class="t2">Soltá para subir tu documento</b><small>PDF, TXT o MD · se procesa en tu navegador</small></div><input type="file" id="fi" multiple accept=".pdf,.txt,.md,.text" hidden>
  <div id="msg" class="err">${esc(msg||'')}</div>
  <div class="feats"><span>${ic('book')} Basado en tu documento</span><span>${ic('target')} Examen en cada tema</span><span>${ic('refresh')} Repaso de tus errores</span><span>${ic('flame')} Racha de estudio</span><span>${ic('sparkles')} Chispa te acompaña</span></div>
  ${S?`<div class="row mt" style="justify-content:center"><button class="btn cont" id="cont">${ic('play')}<span>Continuar: ${esc(S.name)}</span></button></div>`:''}</div>`;
  const dz=$('dz');
  let dg=false;
  dz.addEventListener('dragenter',ev=>{ev.preventDefault();dz.classList.add('on');if(!dg){dg=true;say('¡Hola! Soltalo acá y lo leo.','wow',2500)}});
  dz.addEventListener('dragover',ev=>{ev.preventDefault();if(ev.dataTransfer)ev.dataTransfer.dropEffect='copy';dz.classList.add('on')});
  ['dragleave','drop'].forEach(e=>dz.addEventListener(e,()=>{dz.classList.remove('on');dg=false}));
  dz.addEventListener('drop',ev=>{ev.preventDefault();go([...ev.dataTransfer.files])});
  dz.onclick=()=>$('fi').click();dz.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();$('fi').click()}};
  $('fi').onchange=e=>go([...e.target.files]);
  if(S)$('cont').onclick=map;
  if(!msg)say(S?'¡Hola de nuevo! ¿Seguimos?':pick(MSG.home),'happy',5200)}
async function go(fs){
  const ok=fs.filter(f=>/\.(pdf|txt|md|text)$/i.test(f.name));
  if(!ok.length)return void($('msg').textContent='Formato no admitido. Soltá un PDF, TXT o MD.');
  const name=ok[0].name.replace(/\.[^.]+$/,'').replace(/[_-]+/g,' ').trim()+(ok.length>1?' y '+(ok.length-1)+' más':'');
  load('Leyendo tu material…');say('Estoy leyendo tu documento…','happy',0);
  try{
    let secs=[];
    for(const f of ok){const L=/\.pdf$/i.test(f.name)?await pdfLines(f):await txtLines(f);secs.push(...sections(L))}
    load('Armando tus temas y preguntas…');await new Promise(r=>setTimeout(r,30));
    const temas=buildTemas(secs.slice(0,80),name);if(!temas.length)throw 0;
    S={name,temas,xp:0,missed:[],streak:0,last:''};save();map();say(pick(MSG.ready)+' ('+temas.length+' temas)','wow')
  }catch(e){home('No pude armar el curso: el archivo no tiene texto suficiente. Si es un PDF escaneado, necesita OCR antes.');say('Mmm, no encuentro texto en ese archivo.','sad')}}

/* ---------- mapa ---------- */
function map(){
  if(!S)return home();xp();onkey=null;
  const N=S.temas.length,done=S.temas.filter(t=>t.passed).length,pct=Math.round(done/N*100),C=2*Math.PI*38,nxp=S.xp%100,cur=S.temas.findIndex(t=>!t.passed);
  app.innerHTML=`<div class="card"><div class="hd"><div class="ring"><svg width="92" height="92" viewBox="0 0 92 92"><circle cx="46" cy="46" r="38" fill="none" stroke="var(--line)" stroke-width="9"/><circle cx="46" cy="46" r="38" fill="none" stroke="var(--ac)" stroke-width="9" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-pct/100)}"/></svg><b>${pct}%</b></div>
  <div><small>CAMINO AL EXAMEN</small><h2 class="ttl" title="${esc(S.name)}">${esc(S.name)}</h2><small>${done} de ${N} temas dominados</small></div></div>
  <div class="bar" style="margin-top:14px"><i style="width:${nxp}%"></i></div><small>Nivel ${lvl()+1} · ${nxp}/100 XP para el siguiente</small>
  ${S.temas.map((t,i)=>{const hd=t.unit&&t.unit!==(S.temas[i-1]||{}).unit?`<small class="un">${esc(t.unit)}</small>`:'',un=i===0||S.temas[i-1].passed,s=stars(t.best);return hd+`<div class="lv ${t.passed?'ok':''} ${un?'':'lock'} ${i===cur?'cur':''}" data-i="${i}" tabindex="0" role="button" style="animation-delay:${Math.min(i,12)*40}ms"><div class="bd">${t.passed?ic('check'):un?i+1:ic('lock')}</div><div><b>${esc(t.title)}</b><small>${t.passed?'Mejor puntaje: '+t.best+'%'+(s?'<span class="gold">'+ic('star','f').repeat(s)+'</span>':''):un?(i===cur?ic('arrow')+' Tu próximo tema':'Listo para repasar'):'Aprobá el tema anterior'}</small></div></div>`}).join('')}
  ${S.missed.length>=3?`<div class="row mt"><button class="btn g" id="rv">${ic('refresh')} Repaso de errores (${S.missed.length})</button></div>`:''}</div>`;
  app.querySelectorAll('.lv').forEach(e=>{const f=()=>{if(e.classList.contains('lock')){snd.bad();say(pick(MSG.lock),'sad',3200)}else{snd.tick();study(+e.dataset.i)}};e.onclick=f;e.onkeydown=ev=>{if(ev.key==='Enter')f()}});
  const rv=$('rv');if(rv)rv.onclick=()=>runExam(null,shuf(S.missed.slice()).slice(0,5),true)}

/* ---------- estudio: tal cual está en el material ---------- */
const first=s=>{const m=s.match(/^.{20,}?[.!?](?=\s|$)/);return cut((m?m[0]:s).trim(),150)};
const vq=(t,p)=>first((p.k==='d'?p:t.pages[0]).paras[0]);
const vlink=q=>'https://www.google.com/search?q='+encodeURIComponent(q);
function study(i,k=0){
  const t=S.temas[i],P=t.pages,p=P[k],N=S.temas.length,last=k===P.length-1,dn=P.filter(x=>x.k==='d').length,di=P.slice(0,k+1).filter(x=>x.k==='d').length;
  app.innerHTML=`<div class="card">${t.unit?`<small class="un" style="margin-top:0">${esc(t.unit)}</small>`:''}<div class="row" style="justify-content:space-between"><small>TEMA ${i+1} DE ${N}</small><small>Tarjeta ${k+1} de ${P.length}</small></div>
  <h2>${esc(t.title)}</h2><div class="bar"><i style="width:${(k+1)/P.length*100}%"></i></div>
  <div class="sec ${p.k==='e'?'ex':''}"><span class="lb">${p.k==='e'?ic('bulb')+' Ejemplo':ic('book')+' Desarrollo'+(dn>1?' ('+di+'/'+dn+')':'')}</span>${p.paras.map(x=>`<p>${esc(x)}</p>`).join('')}</div>
  <div class="row mt" style="justify-content:space-between"><button class="btn g" id="pv" ${k?'':'disabled'}>← Anterior</button>${last?'<button class="btn" id="ex">'+ic('target')+' Ir al examen</button>':'<button class="btn" id="nx">Siguiente →</button>'}</div>
  <div class="meta"><span class="src">${ic('file')} Contenido de tu documento</span><a class="vl" href="${vlink(vq(t,p))}" target="_blank" rel="noopener">${ic('search')} Verificar en internet ${ic('ext')}</a></div></div>`;
  snd.tick();if(k&&k%3===2)say(pick(MSG.tip),'happy');
  const pv=()=>{if(k)study(i,k-1)},nx=()=>{last?go2():study(i,k+1)};
  const go2=()=>{if(t.qs.length)runExam(i,t.qs);else{if(!t.passed){t.passed=true;t.best=100;S.xp+=20}save();xp();say('Tema de lectura completado. ¡Seguimos!','wow');i+1<N?study(i+1):map()}};
  $('pv').onclick=pv;if($('nx'))$('nx').onclick=nx;if($('ex'))$('ex').onclick=go2;
  onkey=e=>{if(e.key==='ArrowLeft')pv();else if(e.key==='ArrowRight'||e.key==='Enter')nx()}}

/* ---------- examen ---------- */
function runExam(i,qs,review){
  const list=shuf(qs.map(q=>{const o=shuf(q.options.map((x,n)=>({x,ok:n===q.correct})));return{...q,options:o.map(z=>z.x),correct:o.findIndex(z=>z.ok)}}));
  question({i,list,n:0,ok:0,res:[],combo:0,review:!!review,orig:qs})}
function question(E){
  const q=E.list[E.n],T=E.list.length;
  app.innerHTML=`<div class="card"><div class="row" style="justify-content:space-between"><small>${E.review?'REPASO DE ERRORES':'EXAMEN · TEMA '+(E.i+1)}</small><b>${E.n+1} / ${T}</b></div>
  <div class="dots mt">${E.list.map((_,n)=>`<i class="${n<E.n?(E.res[n]?'k':'x'):n===E.n?'d':''}"></i>`).join('')}</div><div class="q">${esc(q.q)}</div>
  <div>${q.options.map((o,n)=>`<button class="opt" data-n="${n}"><kbd>${n+1}</kbd><span>${esc(o)}</span></button>`).join('')}</div><div id="fb"></div></div>`;
  let done=false;
  const next=()=>{E.n++;E.n<T?question(E):result(E)};
  const choose=n=>{
    if(done)return;done=true;const ok=n===q.correct,b=app.querySelectorAll('.opt')[n];touch();
    if(ok){E.ok++;E.combo++;S.xp+=10;if(E.review)S.missed=S.missed.filter(m=>m.q!==q.q);snd.ok();pop('+10 XP',b);say(E.combo>=3?'¡Racha de '+E.combo+' aciertos!':pick(MSG.ok),E.combo>=3?'wow':'happy',3000)}
    else{E.combo=0;if(!E.review&&!S.missed.some(m=>m.q===q.q)){S.missed.push({q:q.q,options:q.options,correct:q.correct,exp:q.exp,v:q.v});S.missed=S.missed.slice(-30)}snd.bad();say(pick(MSG.bad),'sad',3600)}
    E.res[E.n]=ok;save();xp();
    app.querySelectorAll('.opt').forEach((o,m)=>{o.disabled=true;if(m===q.correct)o.classList.add('c');else if(m===n)o.classList.add('w')});
    $('fb').innerHTML=`<div class="fb ${ok?'g':'b'}"><b class="fh">${ok?ic('check')+' ¡Correcto!':ic('x')+' Todavía no'}</b><br>${esc(q.exp)}<br><small><a href="${vlink(q.v)}" target="_blank" rel="noopener">${ic('search')} Verificar en internet</a></small></div>
    <div class="row mt" style="justify-content:flex-end"><button class="btn" id="nq">${E.n===T-1?'Ver resultado':'Siguiente'} ↵</button></div>`;
    $('nq').onclick=next;$('nq').focus()};
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>choose(+b.dataset.n));
  onkey=e=>{if(!done&&/^[1-9]$/.test(e.key)&&+e.key<=q.options.length)choose(+e.key-1);else if(done&&(e.key==='Enter'||e.key===' ')){e.preventDefault();next()}}}
function result(E){
  const T=E.list.length,sc=Math.round(E.ok/T*100),pass=sc>=70,s=stars(sc);let first=false;
  if(E.i!=null){const t=S.temas[E.i];if(sc>t.best)t.best=sc;if(pass&&!t.passed){t.passed=true;first=true;S.xp+=50}}
  save();xp();
  const nx=E.i!=null&&E.i+1<S.temas.length,fin=E.i!=null&&E.i+1===S.temas.length&&pass;
  if(pass){confetti(first||E.review?170:90);snd.win();say(fin?'¡Terminaste todo el material! Excelente trabajo.':pick(MSG.win),'wow',6000)}else{snd.bad();say(pick(MSG.fail),'sad',5500)}
  app.innerHTML=`<div class="card center"><small>${E.review?'REPASO':'TEMA '+(E.i+1)} · RESULTADO</small><div class="big">${sc}%</div><div class="stars">${ic('star','f').repeat(s)}${ic('star','o').repeat(3-s)}</div><p>${E.ok} de ${T} correctas · +${E.ok*10} XP${first?' · +50 XP por dominar el tema':''}</p>
  <div class="fb ${pass?'g':'b'} mt" style="text-align:left"><b>${pass?(E.review?'¡Buen repaso!':'¡Tema aprobado!'):'Todavía no'}</b><br>${pass?(nx?'Se desbloqueó el siguiente tema.':fin?ic('trophy')+' ¡Terminaste todo el material!':'Seguí así.'):'Necesitás 70% para avanzar. Repasá las fichas y probá otra vez.'}</div>
  <div class="row mt" style="justify-content:center">${pass&&nx?'<button class="btn" id="n1">'+ic('play')+' Siguiente tema</button>':''}${!pass&&E.i!=null?'<button class="btn" id="r1">'+ic('refresh')+' Reintentar</button><button class="btn g" id="r2">'+ic('book')+' Repasar tema</button>':''}<button class="btn g" id="r3">${ic('map')} Mapa</button></div></div>`;
  if($('n1'))$('n1').onclick=()=>study(E.i+1);
  if($('r1'))$('r1').onclick=()=>runExam(E.i,E.orig);
  if($('r2'))$('r2').onclick=()=>study(E.i);
  $('r3').onclick=map;
  onkey=e=>{if(e.key==='Enter'){const b=$('n1')||$('r1')||$('r3');b.click()}}}

/* ---------- barra superior ---------- */
$('bm').onclick=()=>{closeMenu();S?map():home()};
$('bn').onclick=function(){
  const lb=this.querySelector('.lbl');
  if(!S){closeMenu();return home()}
  if(!delArm){delArm=true;this.classList.add('arm');lb.textContent='¿Borrar curso?';setTimeout(()=>{delArm=false;this.classList.remove('arm');lb.textContent='Nuevo curso'},3000);return}
  delArm=false;this.classList.remove('arm');lb.textContent='Nuevo curso';closeMenu();S=null;try{localStorage.removeItem(KEY)}catch(e){}xp();home()};

xp();S?map():home();
</script>
</body>
</html>
